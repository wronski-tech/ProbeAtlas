# Used for authoring migrations: `alembic revision --autogenerate -m "..."`.
# Apply migrations with `probeatlas-admin migrate` (or `alembic upgrade head`).
# The database URL comes from PROBEATLAS_DATABASE_URL.
[alembic]
script_location = src/probeatlas/server/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
