# Continuous integration: lint, documentation coverage, tests against real PostgreSQL, web checks,
# deployment config checks, and container builds. Runs on every push and pull request; no secrets or paid
# services are needed. Pushes to main also publish the images to GHCR (built-in GITHUB_TOKEN).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, docs, tests, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: probeatlas
          POSTGRES_PASSWORD: probeatlas
          POSTGRES_DB: probeatlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U probeatlas" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PROBEATLAS_TEST_DATABASE_URL: postgresql+psycopg://probeatlas:probeatlas@localhost:5432/probeatlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv venv .venv && uv pip install -p .venv -e ".[server,agent,cli,dev]"
      - name: Allow unprivileged ICMP sockets (ICMP check tests)
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - name: Ruff (lint + pydocstyle)
        run: .venv/bin/ruff check src tests scripts
      - name: Every module, class, and function is documented (Python and TypeScript)
        run: .venv/bin/python scripts/check_docstrings.py src tests web/src
      - name: Tests
        run: .venv/bin/pytest
      - name: Migrations match the models
        env:
          PROBEATLAS_DATABASE_URL: ${{ env.PROBEATLAS_TEST_DATABASE_URL }}
        run: .venv/bin/probeatlas-admin migrate && .venv/bin/alembic check
      - name: Published OpenAPI document is up to date
        run: |
          .venv/bin/python -c "import json; from probeatlas.server.main import app; print(json.dumps(app.openapi(), indent=2))" > /tmp/openapi.json
          diff -u docs/openapi.json /tmp/openapi.json || { echo "::error::docs/openapi.json is stale; run 'make openapi'"; exit 1; }

  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deployment config (Terraform, scripts, compose)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format and validate (no credentials, no backend)
        working-directory: deploy/terraform/staging
        run: |
          terraform fmt -check -recursive
          # The OpenStack provider is downloaded from GitHub releases, which intermittently answer 504.
          for attempt in 1 2 3 4 5; do
            terraform init -backend=false -input=false && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 15))
          done
          terraform validate
      - name: Shell scripts
        run: |
          shellcheck --severity=warning -e SC1091 deploy/staging/host/probeatlas-deploy \
            deploy/staging/host/probeatlas-render-env deploy/staging/host/probeatlas-backup \
            deploy/agent/probeatlas-agent-run deploy/backup/pgbackup.sh
      - name: Staging compose file
        run: |
          PROBEATLAS_TAG=0000000000000000000000000000000000000000 PROBEATLAS_APP_DOMAIN=app.example.com \
          PROBEATLAS_API_DOMAIN=api.example.com PROBEATLAS_ACME_EMAIL=ops@example.com PROBEATLAS_ENV_FILE=/dev/null \
            docker compose -f deploy/staging/compose.yml config -q

  images:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only images whose code passed the backend and web checks are published. (The deployment-config job
    # does not test image contents, so an outage at a Terraform provider host cannot block publishing.)
    needs: [backend, web]
    permissions:
      contents: read
      packages: write # push to GHCR (main only)
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          # Links each package to this repository on GHCR.
          label="org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          docker build --label "$label" -f deploy/Dockerfile.server -t probeatlas-server:ci .
          docker build --label "$label" -f deploy/Dockerfile.agent -t probeatlas-agent:ci .
          docker build --label "$label" -t probeatlas-web:ci web
      - name: Agent image runs as non-root and starts
        run: |
          test "$(docker run --rm --entrypoint id probeatlas-agent:ci -u)" != "0"
          docker run --rm --entrypoint probeatlas-agent probeatlas-agent:ci 2>&1 | grep -q "PROBEATLAS_AGENT_REGION is required"
      - name: Publish to GHCR (main only), tagged with the full commit SHA and "main"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          registry="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          for name in server agent web; do
            for tag in "$GITHUB_SHA" main; do
              docker tag "probeatlas-$name:ci" "$registry/probeatlas-$name:$tag"
              docker push --quiet "$registry/probeatlas-$name:$tag"
            done
          done
